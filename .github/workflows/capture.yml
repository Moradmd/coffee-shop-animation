name: Capture video
on:
  push:
    branches: [main]
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install ffmpeg
        run: |
          curl -sL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-x64 > /tmp/ffmpeg
          chmod +x /tmp/ffmpeg
      - name: Install puppeteer
        run: npm install puppeteer 2>&1 | tail -3
      - name: Capture screenshots
        run: |
          mkdir -p /tmp/frames out
          node << 'SCRIPT'
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage', '--disable-gpu', '--disable-extensions'],
              headless: true,
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1920, height: 1080 });
            await page.goto('file://' + process.cwd() + '/index.html', { waitUntil: 'domcontentloaded', timeout: 5000 });
            await new Promise(r => setTimeout(r, 300));

            const TOTAL = 150;
            for (let i = 0; i < TOTAL; i++) {
              await page.evaluate(() => new Promise(r => setTimeout(r, 1000/60)));
              const buf = await page.screenshot({ type: 'png', clip: { x: 0, y: 0, width: 1920, height: 1080, scale: 1 } });
              require('fs').writeFileSync(`/tmp/frames/frame_${String(i).padStart(6, '0')}.png`, buf);
              if (i % 30 === 0) process.stdout.write(`\r${i}/${TOTAL}`);
            }
            console.log(`\rDone: ${TOTAL} frames`);
            await browser.close();
          })();
          SCRIPT
      - name: Encode video
        run: /tmp/ffmpeg -y -framerate 60 -i /tmp/frames/frame_%06d.png -c:v libx264 -pix_fmt yuv420p -crf 18 out/video.mp4 2>&1 | tail -5
      - uses: actions/upload-artifact@v4
        with: { name: video, path: out/video.mp4 }
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}
          files: out/video.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
