name: Capture video
on:
  push:
    branches: [main]
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install ffmpeg
        run: |
          curl -sL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-x64 > /tmp/ffmpeg
          chmod +x /tmp/ffmpeg
      - name: Install puppeteer
        run: npm install puppeteer 2>&1 | tail -3
      - name: Capture screenshots
        run: |
          mkdir -p /tmp/frames
          node << 'SCRIPT'
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage', '--disable-gpu'],
              headless: true,
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1920, height: 1080 });
            await page.goto('file://' + process.cwd() + '/index.html', { waitUntil: 'domcontentloaded' });
            await new Promise(r => setTimeout(r, 500));

            const FPS = 30;
            const DURATION = 30;
            const TOTAL = FPS * DURATION;

            for (let i = 0; i < TOTAL; i++) {
              await new Promise(resolve => setTimeout(resolve, 1000 / FPS));
              await page.screenshot({ path: `/tmp/frames/frame_${String(i).padStart(6, '0')}.png`, type: 'png' });
              if (i % 30 === 0) process.stdout.write(`\rFrame ${i}/${TOTAL}`);
            }
            console.log(`\rAll ${TOTAL} frames captured`);
            await browser.close();
          })();
          SCRIPT
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      - name: Encode video
        run: |
          /tmp/ffmpeg -y -framerate 30 -i /tmp/frames/frame_%06d.png -c:v libx264 -pix_fmt yuv420p -crf 18 out/video.mp4
      - uses: actions/upload-artifact@v4
        with: { name: video, path: out/video.mp4 }
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}
          files: out/video.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
